actor: FunctionalTester
paths:
    tests: .
    output: _output
    data: _data
    support: _support
    envs: _envs
settings:
    bootstrap: _bootstrap.php
    suite_class: \Codeception\Suite
    colors: true
    memory_limit: 1024M
suites:
    smoke:
        actor: FunctionalTester
        path: smoke
extensions:
    enabled:
        - Codeception\Extension\RunFailed
modules:
    enabled:
        - Asserts
