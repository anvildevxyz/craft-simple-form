actor: Tester
paths:
  tests: tests
  output: tests/_output
  data: tests/_data
  support: tests/_support
  envs: tests/_envs
bootstrap: _craft_bootstrap.php
settings:
  params:
    - tests/.env
modules:
  config:
    \craft\test\Craft:
      configFile: 'tests/_craft/config/test.php'
      entryUrl: 'https://craft-plugin-dev.ddev.site/index.php'
      projectConfig: {}
      # The full schema is one consolidated Install migration; apply it so the
      # test DB has the plugin tables.
      migrations:
        - class: fabianhaef\simpleform\migrations\Install
          params: {}
      plugins:
        - handle: simple-form
          class: fabianhaef\simpleform\Plugin
      cleanup: true
      transaction: true
      dbSetup:
        clean: true
        setupCraft: true
