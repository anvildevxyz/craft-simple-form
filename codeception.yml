actor: Tester
paths:
  tests: tests
  output: tests/_output
  data: tests/_data
  support: tests/_support
  envs: tests/_envs
bootstrap: _craft_bootstrap.php
settings:
  params:
    - tests/.env
modules:
  config:
    \craft\test\Craft:
      configFile: 'tests/_craft/config/test.php'
      entryUrl: 'https://craft-plugin-dev.ddev.site/index.php'
      projectConfig: {}
      # simple-form ships its schema as a content migration (m240614_000001_init),
      # not as an Install.php migration, so plugin install alone does NOT create the
      # tables. Apply it explicitly here so the test DB has the plugin schema.
      migrations:
        - class: fabianhaef\simpleform\migrations\m240614_000001_init
          params: {}
        - class: fabianhaef\simpleform\migrations\m260615_000001_field_option_labels
          params: {}
        - class: fabianhaef\simpleform\migrations\m260615_000002_form_email_body
          params: {}
        - class: fabianhaef\simpleform\migrations\m260615_000003_field_error_message
          params: {}
        - class: fabianhaef\simpleform\migrations\m260618_000001_integrations
          params: {}
        - class: fabianhaef\simpleform\migrations\m260618_000002_submission_spam_status
          params: {}
        - class: fabianhaef\simpleform\migrations\m260618_000003_global_form_integrations
          params: {}
        - class: fabianhaef\simpleform\migrations\m260618_000004_notifications
          params: {}
        - class: fabianhaef\simpleform\migrations\m260618_000005_submission_element_fk
          params: {}
        - class: fabianhaef\simpleform\migrations\m260618_000006_audit_log
          params: {}
        - class: fabianhaef\simpleform\migrations\m260619_000001_submission_payments
          params: {}
        # m260620_000001 (secret backfill) is intentionally NOT listed: it calls
        # Plugin::getInstance(), which is null in Codeception's migration runner.
        # Its logic is covered directly by IntegrationExposureTest instead.
        - class: fabianhaef\simpleform\migrations\m260620_000002_submission_spam_reason
          params: {}
        - class: fabianhaef\simpleform\migrations\m260620_000003_form_allow_save_resume
          params: {}
        - class: fabianhaef\simpleform\migrations\m260620_000004_form_drafts
          params: {}
        - class: fabianhaef\simpleform\migrations\m260621_000001_notification_attachments
          params: {}
      plugins:
        - handle: simple-form
          class: fabianhaef\simpleform\Plugin
      cleanup: true
      transaction: true
      dbSetup:
        clean: true
        setupCraft: true
